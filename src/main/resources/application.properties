spring.application.name=reto-franquicias
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/franquicias?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:franquicias}
spring.datasource.password=${DB_PASSWORD:franquicias}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
server.port=${PORT:8080}
