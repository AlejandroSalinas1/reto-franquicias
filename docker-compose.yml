services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: franquicias
      MYSQL_USER: franquicias
      MYSQL_PASSWORD: franquicias
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - datos_mysql:/var/lib/mysql

  api:
    build: .
    environment:
      DB_URL: jdbc:mysql://mysql:3306/franquicias?serverTimezone=UTC
      DB_USER: franquicias
      DB_PASSWORD: franquicias
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  datos_mysql:
